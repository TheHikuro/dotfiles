dotfiles_path: "{{ lookup('env', 'DOTFILES_PATH') | default(lookup('env', 'HOME') + '/dotfiles', true) }}"

home: "{{ ansible_facts['env']['HOME'] }}"
homebrew_prefix: "{{ '/opt/homebrew' if ansible_facts['architecture'] == 'arm64' else '/usr/local' }}"
homebrew_bin: "{{ homebrew_prefix }}/bin"

# Shell par défaut. nushell reste installé et configuré comme filet de sécurité
# (rôle `nushell`) : pour revenir en arrière, repasser cette valeur à /nu et
# relancer `chsh -s {{ homebrew_bin }}/nu`.
target_shell: "{{ homebrew_bin }}/fish"

homebrew_packages:
  - git
  - zoxide
  - carapace
  - starship
  - nushell
  - fish
  - zellij
  - mise
  - ripgrep
  - fzf
  - fd
  - bat
  - eza
  - neovim
  - watchman
  - btop
  - sops
  - age
  - herdr

homebrew_casks:
  - ghostty

mise_tools:
  node: "latest"
  bun: "latest"
